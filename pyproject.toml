[project]
name = "auto-company"
version = "1.1.0"
description = "Auto Company — 24/7 autonomous agent loop with dual-engine CLI support"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "flask",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py39"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["dashboard_server"]
